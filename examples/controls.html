<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>WasmGPU Controls Example</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #05070a; overflow: hidden; color: #d8e2ef; font: 12px/1.4 monospace; }
            canvas { display: block; width: 100vw; height: 100vh; }
            .hud { position: fixed; left: 10px; top: 10px; padding: 10px; background: rgba(5, 10, 18, 0.75); border: 1px solid rgba(180, 210, 255, 0.2); white-space: pre-line; }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <div class="hud"></div>
        <script src="../dist/WasmGPU.iife.min.js"></script>
        <script type="module">
            const canvas = document.querySelector("canvas"), hud = document.querySelector(".hud");
            const wgpu = await WasmGPU.create(canvas, { powerPreference: "high-performance", antialias: true, frustumCulling: true });
            const scene = wgpu.createScene([0.02, 0.03, 0.04]);
            const perspective = wgpu.createCamera.perspective({ fov: 50, near: 0.05, far: 500 });
            const orthographic = wgpu.createCamera.orthographic({ left: -10, right: 10, top: 10, bottom: -10, near: 0.05, far: 500 });
            perspective.transform.setPosition(26, 12, 26);
            perspective.lookAt(0, 0, 0);
            orthographic.transform.copyFrom(perspective.transform);

            const controls = wgpu.createControls.navigation(perspective, canvas, {
                mode: "orbit", target: [0, 0, 0],
                enableDamping: true, dampingFactor: 0.1, zoomOnCursor: true,
                minDistance: 0.5, maxDistance: 400
            });

            const generate = (n) => {
                const data = new Float32Array(n * 4);
                const min = [Infinity, Infinity, Infinity];
                const max = [-Infinity, -Infinity, -Infinity];
                for (let i = 0; i < n; i++) {
                    const u = i / Math.max(1, n - 1);
                    const strand = i % 3;
                    const theta = (u * 28.0) + (strand * 2.09439510239) + (Math.sin(u * 60.0) * 0.35);
                    const radius = 2.0 + (17.0 * u) + (1.75 * Math.sin((u * 18.0) + strand));
                    const jitterX = (Math.random() - 0.5) * 0.85, jitterY = (Math.random() - 0.5) * 0.85, jitterZ = (Math.random() - 0.5) * 0.85;
                    const x = (radius * Math.cos(theta)) + jitterX;
                    const y = (-14.0 + (28.0 * u)) + (3.0 * Math.sin((theta * 0.45) + strand)) + jitterY;
                    const z = (0.42 * radius * Math.sin(theta)) + (8.0 * Math.sin((u * 7.0) + strand)) + jitterZ;
                    const scalar = Math.min(1, Math.max(0, (0.55 * u) + (0.45 * (0.5 + 0.5 * Math.sin(theta + (u * 8.0))))));
                    const o = i * 4;
                    data[o + 0] = x;
                    data[o + 1] = y;
                    data[o + 2] = z;
                    data[o + 3] = scalar;
                    if (x < min[0]) min[0] = x;
                    if (y < min[1]) min[1] = y;
                    if (z < min[2]) min[2] = z;
                    if (x > max[0]) max[0] = x;
                    if (y > max[1]) max[1] = y;
                    if (z > max[2]) max[2] = z;
                }
                return { data, boundsMin: min, boundsMax: max };
            };

            const data = generate(100000);
            scene.add(wgpu.createPointCloud({
                data: data.data, keepCPUData: true,
                boundsMin: data.boundsMin, boundsMax: data.boundsMax,
                basePointSize: 5.0, minPointSize: 1.0, maxPointSize: 10.0,
                sizeAttenuation: 1.8, softness: 0.3, opacity: 1, gamma: 0.9,
                blendMode: "additive", colormap: "turbo"
            }));

            let activeCamera = perspective;
            let currentView = "front";

            const updateProjection = () => {
                if (activeCamera.type === "perspective") activeCamera.updateAspect(Math.max(1, canvas.clientWidth), Math.max(1, canvas.clientHeight));
            };

            const updateHud = () => {
                hud.textContent = [
                    `Mode: ${controls.mode}`,
                    `Camera: ${activeCamera.type}`,
                    `View: ${currentView ?? "free"}`,
                    "", "1 orbit", "2 trackball",
                    "W/S front/back", "A/D left/right", "Q/E top/bottom",
                    "X fit to bounds", "C toggle orthographic"
                ].join("\n");
            };

            const fitCurrent = (view = currentView, animate = true) => {
                updateProjection();
                if (view) controls.viewBounds(view, scene, { animate, duration: 0.5, padding: 1.2 });
                else controls.fitScene(scene, { animate, duration: 1, padding: 1 });
            };

            const switchCamera = (next) => {
                if (next === activeCamera) return;
                next.transform.copyFrom(activeCamera.transform);
                activeCamera = next;
                controls.setCamera(activeCamera);
                updateProjection();
                fitCurrent(currentView, true);
                updateHud();
            };

            window.addEventListener("keydown", (event) => {
                const key = event.key.toLowerCase();
                if (key === "1") { controls.setMode("orbit"); updateHud();
                } else if (key === "2") { controls.setMode("trackball"); updateHud();
                } else if (key === "w") { currentView = "front"; fitCurrent(currentView, true); updateHud();
                } else if (key === "s") { currentView = "back"; fitCurrent(currentView, true); updateHud();
                } else if (key === "a") { currentView = "left"; fitCurrent(currentView, true); updateHud();
                } else if (key === "d") { currentView = "right"; fitCurrent(currentView, true); updateHud();
                } else if (key === "q") { currentView = "top"; fitCurrent(currentView, true); updateHud();
                } else if (key === "e") { currentView = "bottom"; fitCurrent(currentView, true); updateHud();
                } else if (key === "x") { fitCurrent(currentView, true);
                } else if (key === "c") { switchCamera(activeCamera === perspective ? orthographic : perspective); }
            });
            window.addEventListener("resize", updateProjection);
            updateProjection();
            fitCurrent(currentView, false);
            updateHud();

            wgpu.run((dt, time) => {
                updateProjection();
                controls.update(dt);
                wgpu.render(scene, activeCamera);
            });
        </script>
    </body>
</html>
